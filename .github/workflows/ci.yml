name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test -- --ci

      # Pega app.json inválido ou plugin mal configurado antes do build,
      # que é onde o erro custa dez minutos de espera.
      - name: Validar configuração do Expo
        run: npx expo config --type public > /dev/null
